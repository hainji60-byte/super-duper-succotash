<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Redirect Page</title>
    
    <!-- 1. Facebook Open Graph Tags (Yeh Facebook par image show karne ke liye hain) -->
    <meta property="og:title" content="See More">
    <meta property="og:description" content="10 Millon Views">
    <meta property="og:image" content="https://i.postimg.cc/zX8z04xs/play-image-1786148977499.jpg">
    <meta property="og:url" content="https://blog.sentbola.xyz/top-10-world-class-hospitals-in-singapore-for-exceptional-healthcare/">
    <meta property="og:type" content="website">

    <!-- 2. Auto Redirect Script (Jaise hi koi click karke aayega, seedha target website par chala jayega) -->
    <script>
        window.location.replace("https://blog.sentbola.xyz/top-10-world-class-hospitals-in-singapore-for-exceptional-healthcare/");
    </script>
</head>
<body>

    <!-- 3. Web page ya App par kholne par yeh tasveer show hogi aur click karne par redirect hogi -->
    <div style="text-align: center; margin-top: 20vh;">
        <a href="https://blog.sentbola.xyz/top-10-world-class-hospitals-in-singapore-for-exceptional-healthcare/">
            <img src="https://i.postimg.cc/zX8z04xs/play-image-1786148977499.jpg" alt="Image" style="max-width: 100%; height: auto; border-radius: 8px; cursor: pointer;">
        </a>
    </div>

</body>
</html>
